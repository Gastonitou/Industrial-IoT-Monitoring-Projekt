<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="400" fill="#111217"/>
  <rect width="960" height="48" fill="#1c1e2d"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#e8e9ed">⚠️  Alert Panel – Anomaly Detection</text>
  <text x="800" y="30" font-size="11" fill="#e74c3c" font-weight="bold">3 ACTIVE ALERTS</text>

  <!-- Alert banner -->
  <rect x="16" y="60" width="928" height="50" rx="6" fill="#2d1515" stroke="#e74c3c" stroke-width="2"/>
  <text x="480" y="91" text-anchor="middle" font-size="15" font-weight="bold" fill="#e74c3c">🚨 ANOMALY DETECTED – MACHINE-03 Temperature: 91.4°C (threshold: 85°C)</text>

  <!-- Temperature spike panel -->
  <rect x="16" y="125" width="600" height="220" rx="6" fill="#1c1e2d" stroke="#e74c3c" stroke-width="2"/>
  <text x="30" y="147" font-size="12" fill="#a3a6b4">Temperature – Anomaly Event</text>
  <!-- Normal line then spike -->
  <polyline points="30,300 100,285 170,275 240,270 310,265 380,260 440,250 500,160 560,145 600,140" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
  <!-- Normal range shading -->
  <rect x="30" y="230" width="310" height="90" fill="#2ecc71" fill-opacity="0.08"/>
  <!-- Threshold line -->
  <line x1="30" y1="200" x2="600" y2="200" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="560" y="196" font-size="10" fill="#e74c3c" font-weight="bold">85°C ⚠</text>
  <!-- Spike annotation -->
  <line x1="500" y1="160" x2="500" y2="120" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="460" y="105" width="120" height="20" rx="4" fill="#e74c3c"/>
  <text x="520" y="118" text-anchor="middle" font-size="10" fill="#fff">91.4°C @ 10:15:35</text>
  <!-- Y axis -->
  <text x="25" y="205" font-size="9" fill="#5d6070" text-anchor="end">85</text>
  <text x="25" y="265" font-size="9" fill="#5d6070" text-anchor="end">70</text>
  <text x="25" y="300" font-size="9" fill="#5d6070" text-anchor="end">60</text>
  <text x="310" y="340" text-anchor="middle" font-size="10" fill="#5d6070">time →</text>

  <!-- Alert details panel -->
  <rect x="630" y="125" width="314" height="220" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="644" y="147" font-size="12" fill="#a3a6b4">Alert Details</text>
  <rect x="630" y="155" width="314" height="24" fill="#2c2f45"/>
  <text x="644" y="171" font-size="10" fill="#a3a6b4">Machine</text>
  <text x="730" y="171" font-size="10" fill="#a3a6b4">Type</text>
  <text x="820" y="171" font-size="10" fill="#a3a6b4">Value</text>
  <!-- row 1 -->
  <rect x="630" y="179" width="314" height="24" fill="#2d1515"/>
  <text x="644" y="195" font-size="11" font-weight="bold" fill="#e74c3c">MACHINE-03</text>
  <text x="730" y="195" font-size="11" fill="#e74c3c">HIGH_TEMP</text>
  <text x="820" y="195" font-size="11" fill="#e74c3c">91.4°C</text>
  <!-- row 2 -->
  <text x="644" y="219" font-size="11" fill="#e8e9ed">MACHINE-01</text>
  <text x="730" y="219" font-size="11" fill="#e67e22">HIGH_VIB</text>
  <text x="820" y="219" font-size="11" fill="#e67e22">8.2 mm/s</text>
  <line x1="630" y1="225" x2="944" y2="225" stroke="#2c2f45" stroke-width="1"/>
  <!-- row 3 -->
  <text x="644" y="244" font-size="11" fill="#e8e9ed">MACHINE-02</text>
  <text x="730" y="244" font-size="11" fill="#f1c40f">HIGH_PWR</text>
  <text x="820" y="244" font-size="11" fill="#f1c40f">13 500W</text>
  <line x1="630" y1="250" x2="944" y2="250" stroke="#2c2f45" stroke-width="1"/>
  <!-- Logged to CSV note -->
  <text x="787" y="320" text-anchor="middle" font-size="11" fill="#a3a6b4">✓ All alerts logged to</text>
  <text x="787" y="336" text-anchor="middle" font-size="11" fill="#3498db">data/alerts_log.csv</text>

  <text x="480" y="390" text-anchor="middle" font-size="10" fill="#5d6070">Grafana – Alert Panel | Industrial IoT Monitoring System</text>
</svg>
