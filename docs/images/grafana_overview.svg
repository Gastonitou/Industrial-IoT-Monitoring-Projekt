<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Arial, sans-serif">
  <!-- Dark background -->
  <rect width="960" height="540" fill="#111217"/>

  <!-- Top bar -->
  <rect width="960" height="48" fill="#1c1e2d"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#e8e9ed">🏭  Industrial IoT Monitor – Machine Overview</text>
  <text x="800" y="22" font-size="11" fill="#8e9099">Last 1 hour</text>
  <rect x="800" y="28" width="100" height="14" rx="3" fill="#2c2f45"/>
  <text x="850" y="39" text-anchor="middle" font-size="10" fill="#a3a6b4">Auto-refresh 5s</text>

  <!-- ── Panel 1: Temperature ── -->
  <rect x="16" y="60" width="295" height="210" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="30" y="82" font-size="12" fill="#a3a6b4">Temperature (°C)</text>
  <!-- alert threshold line -->
  <line x1="30" y1="110" x2="297" y2="110" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="250" y="107" font-size="9" fill="#e74c3c">85°C limit</text>
  <!-- simulated line chart -->
  <polyline points="30,210 70,190 110,170 150,155 190,175 230,145 270,160 295,150" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="155" y="255" text-anchor="middle" font-size="10" fill="#5d6070">time →</text>
  <!-- y-axis labels -->
  <text x="25" y="155" font-size="9" fill="#5d6070" text-anchor="end">70</text>
  <text x="25" y="190" font-size="9" fill="#5d6070" text-anchor="end">60</text>
  <text x="25" y="215" font-size="9" fill="#5d6070" text-anchor="end">50</text>
  <!-- current value -->
  <text x="155" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="#3498db">63.2 °C</text>

  <!-- ── Panel 2: Vibration ── -->
  <rect x="327" y="60" width="295" height="210" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="341" y="82" font-size="12" fill="#a3a6b4">Vibration (mm/s)</text>
  <line x1="341" y1="120" x2="608" y2="120" stroke="#e67e22" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="117" font-size="9" fill="#e67e22">7.5 limit</text>
  <polyline points="341,200 381,195 421,185 461,175 501,190 541,165 581,180 608,170" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="466" y="255" text-anchor="middle" font-size="10" fill="#5d6070">time →</text>
  <text x="336" y="175" font-size="9" fill="#5d6070" text-anchor="end">4</text>
  <text x="336" y="195" font-size="9" fill="#5d6070" text-anchor="end">3</text>
  <text x="336" y="210" font-size="9" fill="#5d6070" text-anchor="end">2</text>
  <text x="466" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="#e67e22">3.4 mm/s</text>

  <!-- ── Panel 3: Power ── -->
  <rect x="638" y="60" width="306" height="210" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="652" y="82" font-size="12" fill="#a3a6b4">Power Consumption (W)</text>
  <line x1="652" y1="115" x2="930" y2="115" stroke="#f1c40f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="870" y="112" font-size="9" fill="#f1c40f">12 000W limit</text>
  <polyline points="652,195 692,185 732,190 772,170 812,180 852,165 892,175 930,160" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="784" y="255" text-anchor="middle" font-size="10" fill="#5d6070">time →</text>
  <text x="647" y="175" font-size="9" fill="#5d6070" text-anchor="end">9k</text>
  <text x="647" y="195" font-size="9" fill="#5d6070" text-anchor="end">8k</text>
  <text x="784" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="#2ecc71">8 520 W</text>

  <!-- ── Row 2: Status + Alerts ── -->

  <!-- Machine Status stat panel -->
  <rect x="16" y="285" width="200" height="100" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="116" y="308" text-anchor="middle" font-size="12" fill="#a3a6b4">MACHINE-01 Status</text>
  <text x="116" y="358" text-anchor="middle" font-size="28" font-weight="bold" fill="#2ecc71">RUNNING</text>

  <rect x="230" y="285" width="200" height="100" rx="6" fill="#1c1e2d" stroke="#f1c40f" stroke-width="2"/>
  <text x="330" y="308" text-anchor="middle" font-size="12" fill="#a3a6b4">MACHINE-02 Status</text>
  <text x="330" y="358" text-anchor="middle" font-size="28" font-weight="bold" fill="#f1c40f">WARNING</text>

  <rect x="444" y="285" width="200" height="100" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="544" y="308" text-anchor="middle" font-size="12" fill="#a3a6b4">MACHINE-03 Status</text>
  <text x="544" y="358" text-anchor="middle" font-size="28" font-weight="bold" fill="#e74c3c">ALERT</text>

  <!-- Alerts table panel -->
  <rect x="658" y="285" width="286" height="240" rx="6" fill="#1c1e2d" stroke="#2c2f45" stroke-width="1"/>
  <text x="672" y="308" font-size="12" fill="#a3a6b4">Active Alerts</text>
  <!-- Table header -->
  <rect x="658" y="315" width="286" height="22" fill="#2c2f45"/>
  <text x="672" y="330" font-size="10" fill="#a3a6b4">Time</text>
  <text x="760" y="330" font-size="10" fill="#a3a6b4">Machine</text>
  <text x="840" y="330" font-size="10" fill="#a3a6b4">Alert</text>
  <!-- Table rows -->
  <text x="672" y="354" font-size="10" fill="#e74c3c">10:15:35</text>
  <text x="760" y="354" font-size="10" fill="#e8e9ed">MACHINE-03</text>
  <text x="840" y="354" font-size="10" fill="#e74c3c">HIGH_TEMP</text>
  <line x1="658" y1="360" x2="944" y2="360" stroke="#2c2f45" stroke-width="1"/>
  <text x="672" y="376" font-size="10" fill="#e67e22">10:10:20</text>
  <text x="760" y="376" font-size="10" fill="#e8e9ed">MACHINE-01</text>
  <text x="840" y="376" font-size="10" fill="#e67e22">HIGH_VIB</text>
  <line x1="658" y1="382" x2="944" y2="382" stroke="#2c2f45" stroke-width="1"/>
  <text x="672" y="398" font-size="10" fill="#f1c40f">10:05:10</text>
  <text x="760" y="398" font-size="10" fill="#e8e9ed">MACHINE-02</text>
  <text x="840" y="398" font-size="10" fill="#f1c40f">HIGH_PWR</text>

  <!-- Footer -->
  <text x="480" y="530" text-anchor="middle" font-size="10" fill="#5d6070">Grafana – Industrial IoT Monitoring System | InfluxDB datasource</text>
</svg>
