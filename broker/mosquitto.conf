# Mosquitto MQTT Broker Configuration

# ─── Listener ────────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket listener (for browser-based clients)
listener 9001
protocol websockets

# ─── Security ────────────────────────────────────────────────────────────────────
# Allow anonymous connections (set to false and configure password_file in production)
allow_anonymous true

# Uncomment and configure the lines below to enable authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# ─── Persistence ─────────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ─────────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ─── Connection limits ────────────────────────────────────────────────────────────
max_connections 100
max_keepalive 300
